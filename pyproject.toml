[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zalo-sdk"
version = "1.0.0"
description = "Comprehensive Python SDK for Zalo Mobile App Protocol (TCP Socket Gateway PROV + D3 & HTTP/2 REST APIs)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Zalo SDK Team" }
]
dependencies = [
    "cryptography>=41.0.0",
    "pycryptodome>=3.19.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0"
]

[project.scripts]
zalo-login = "core.login.__main__:main"

[tool.setuptools.packages.find]
include = ["core*"]
